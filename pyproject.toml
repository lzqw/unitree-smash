[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quadsmash-sim"
version = "0.1.0"
description = "Reproducible Unitree quadruped badminton smash simulation baseline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]
isaaclab = ["torch>=2.2", "gymnasium>=0.29"]
dev = ["quadsmash-sim[test]"]

[tool.setuptools.packages.find]
include = ["quadsmash*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

